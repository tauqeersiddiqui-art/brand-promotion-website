# Railway Configuration
# Uses Dockerfile to build with Debian and native tools (g++, python3, make)
# needed for better-sqlite3 compilation

[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'node scripts/seed.js && npm start'"
# /health checks SQLite and storage and returns 503 when either is broken. The
# homepage used to be the health check, so a slow render could mark the deploy
# unhealthy and every probe ran a full page render.
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

# Persistent volume — keeps the SQLite database, uploads and backups across deploys.
# Without this, every deploy wipes orders, screenshots and user accounts.
[[volume]]
mount = "/data"
diskSize = 1024